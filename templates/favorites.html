<!DOCTYPE html>
<html>

<head>

    <title>My Favorite Outfits</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body{
            background:#f8f9fa;
        }

        .gallery{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
            gap:25px;
        }

        .gallery-item{
            background:white;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 4px 10px rgba(0,0,0,.15);
        }

        .gallery-item img{
            width:100%;
            height:450px;
            object-fit:contain;
            background:#fff;
            padding:10px;
        }

        .details{
            padding:15px;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-5">

        <h1 class="fw-bold">
            ❤️ My Favorite Outfits
            <span id="favoriteCount"
                class="badge bg-dark">
            </span>
        </h1>

        <a href="/" class="btn btn-dark">
            Home
        </a>

    </div>

    <div
        id="favoritesContainer"
        class="gallery">
    </div>

</div>

<script>

const favorites =
    JSON.parse(
        localStorage.getItem("favorites")
    ) || [];

const allOutfits = {{ outfits | tojson | safe }};

const container =
    document.getElementById(
        "favoritesContainer"
    );

const selected =
    allOutfits.filter(
        outfit =>
        favorites.includes(outfit.id)
    );


document.getElementById(
    "favoriteCount"
).innerText = selected.length;

if(selected.length === 0){

    container.innerHTML = `
        <div class="alert alert-info">
            No favorite outfits saved yet.
        </div>
    `;

}else{

    selected.forEach(outfit => {

        container.innerHTML += `

        <div class="gallery-item">

            <img
                src="/static/outfit_images/${outfit.image_url}"
                alt="Outfit"
            >

            <div class="details">

                <h5 class="mb-3">
                    Outfit #${outfit.id}
                </h5>

                <p>
                    <strong>Top Wear:</strong>
                    ${outfit.top_wear}
                </p>

                <p>
                    <strong>Bottom Wear:</strong>
                    ${outfit.bottom_wear}
                </p>

                <p>
                    <strong>Footwear:</strong>
                    ${outfit.footwear}
                </p>

                <p>
                    <strong>Accessories:</strong>
                    ${outfit.accessories || "None"}
                </p>

                <button
                    class="btn btn-danger w-100"
                    onclick="removeFavorite(${outfit.id})">

                    Remove Favorite

                </button>

            </div>

        </div>

        `;
    });
}

function removeFavorite(id){

    if(
        !confirm(
            "Remove this outfit from favorites?"
        )
    ){
        return;
    }

    let favorites =
        JSON.parse(
            localStorage.getItem("favorites")
        ) || [];

    favorites =
        favorites.filter(
            item => item !== id
        );

    localStorage.setItem(
        "favorites",
        JSON.stringify(favorites)
    );

    location.reload();
}

</script>

</body>

</html>
