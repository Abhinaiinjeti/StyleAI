<!DOCTYPE html>
<html>

<head>

    <title>StyleAI - Outfit Recommendation</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold logo-text" href="/">
            StyleAI
        </a>

        <a href="/" class="btn btn-dark">
            Home
        </a>

    </div>

</nav>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card p-4">

                <div class="text-center mb-4">

                    <h1 class="fw-bold">
                        Outfit Recommendation
                    </h1>

                    <p class="text-muted">
                        Upload your image and discover your perfect style
                    </p>

                </div>

                <form
                    action="/recommend"
                    method="POST"
                    enctype="multipart/form-data"
                >

                    <!-- IMAGE -->

                    <div class="mb-4">

                        <label class="form-label fw-bold">

                            📷 Upload Image

                        </label>

                       <label class="form-label mt-2">
                          📷 Take Photo
                        </label>

                        <input
                            type="file"
                            class="form-control"
                            id="cameraInput"
                            accept="image/*"
                            capture="environment"
                        >

                        <label class="form-label mt-3">
                            🖼️ Choose From Gallery
                        </label>

                        <input
                            type="file"
                            class="form-control"
                            id="galleryInput"
                            accept="image/*"
                        >

                        <input
                            type="file"
                            id="imageInput"
                            name="image"
                            style="display:none;"
                            accept="image/*"
                        >

                        <small class="text-muted">

                            Mobile: Camera or Gallery

                            <br>

                            Laptop: File Upload

                        </small>

                    </div>

                    <!-- IMAGE PREVIEW -->

                    <div class="text-center mb-4">

                        <img
                            id="previewImage"
                            src=""
                            class="img-thumbnail"
                            style="
                                max-width:250px;
                                display:none;
                            "
                        >

                    </div>

                    <!-- OCCASION -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            🎯 Occasion

                        </label>

                        <select
                            class="form-select"
                            name="occasion"
                            required
                        >

                            <option value="">
                                Select Occasion
                            </option>

                            <option value="College">
                                College
                            </option>

                            <option value="Office">
                                Office
                            </option>

                            <option value="Interview">
                                Interview
                            </option>

                            <option value="Party">
                                Party
                            </option>

                        </select>

                    </div>

                    <!-- STYLE -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            👔 Style

                        </label>

                        <select
                            class="form-select"
                            name="style"
                            required
                        >

                            <option value="">
                                Select Style
                            </option>

                            <option value="Casual">
                                Casual
                            </option>

                            <option value="Formal">
                                Formal
                            </option>

                            <option value="Smart Casual">
                                Smart Casual
                            </option>

                        </select>

                    </div>

                    <!-- CITY -->

                    <div class="mb-4">

                        <label class="form-label fw-bold">

                            🌍 City

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="city"
                            placeholder="Enter your city"
                            required
                        >

                    </div>

                    <!-- BUTTON -->

                    <div class="text-center">

                        <button
                            type="submit"
                            class="btn btn-dark btn-lg"
                            id="submitBtn"
                        >

                            ✨ Discover Your Perfect Outfit

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<!-- LOADING SCREEN -->

<div
    id="loadingScreen"
    style="
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:white;
        z-index:9999;
    "
>

    <div
        class="d-flex flex-column justify-content-center align-items-center"
        style="height:100vh;"
    >

        <div
            class="spinner-border text-dark"
            style="
                width:4rem;
                height:4rem;
            "
        >
        </div>

        <h3 class="mt-4">

            Finding Your Perfect Outfit...

        </h3>

        <p class="text-muted">

            Analyzing Skin Tone • Checking Weather • Matching Styles

        </p>

    </div>

</div>

<script>

const previewImage =
    document.getElementById("previewImage");

const hiddenInput =
    document.getElementById("imageInput");

function setImage(file){

    if(!file) return;

    const dt =
        new DataTransfer();

    dt.items.add(file);

    hiddenInput.files =
        dt.files;

    const reader =
        new FileReader();

    reader.onload = function(e){

        previewImage.src =
            e.target.result;

        previewImage.style.display =
            "block";
    };

    reader.readAsDataURL(file);
}

/* CAMERA */

document
.getElementById("cameraInput")
.addEventListener(
    "change",
    function(e){

        setImage(
            e.target.files[0]
        );
    }
);

/* GALLERY */

document
.getElementById("galleryInput")
.addEventListener(
    "change",
    function(e){

        setImage(
            e.target.files[0]
        );
    }
);

/* FORM SUBMIT */

document
.querySelector("form")
.addEventListener(
    "submit",
    function(e){

        if(
            hiddenInput.files.length === 0
        ){

            alert(
                "Please select or capture an image."
            );

            e.preventDefault();

            return;
        }

        document
        .getElementById(
            "loadingScreen"
        )
        .style.display =
            "block";
    }
);

</script>

</body>

</html>
