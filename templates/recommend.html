<!DOCTYPE html>
<html>

<head>

    <title>StyleAI - Outfit Recommendation</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold logo-text" href="/">
            StyleAI
        </a>

        <a href="/" class="btn btn-dark">
            Home
        </a>

    </div>

</nav>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card p-4">

                <div class="text-center mb-4">

                    <h1 class="fw-bold">
                        Outfit Recommendation
                    </h1>

                    <p class="text-muted">
                        Upload your image and discover your perfect style
                    </p>

                </div>

                <form
                    action="/recommend"
                    method="POST"
                    enctype="multipart/form-data"
                >

                    <!-- IMAGE -->

                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Upload Your Photo
                        </label>

                        <input
                            type="file"
                            class="form-control"
                            id="imageInput"
                            name="image"
                            accept="image/*"
                            required
                        >

                        <small class="text-muted">
                            Mobile: Camera or Gallery
                            <br>
                            Laptop/Desktop: Browse Files
                        </small>

                    </div>
                    

                    <!-- IMAGE PREVIEW -->

                    <div class="text-center mb-4">

                        <img
                            id="previewImage"
                            src=""
                            class="img-thumbnail"
                            style="
                                width:300px;
                                height:300px;
                                object-fit:cover;
                                display:none;
                                border-radius:20px;
                            "
                        >

                    </div>
                    <!-- OCCASION -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            Occasion

                        </label>

                        <select
                            class="form-select"
                            name="occasion"
                            required
                        >

                            <option value="">
                                Select Occasion
                            </option>

                            <option value="College">
                                College
                            </option>

                            <option value="Office">
                                Office
                            </option>

                            <option value="Interview">
                                Interview
                            </option>

                            <option value="Party">
                                Party
                            </option>

                        </select>

                    </div>

                    <!-- STYLE -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">

                            Style Preference

                        </label>

                        <select
                            class="form-select"
                            name="style"
                        
                        >

                            <option value="">
                                Any Style (Recommended)
                            </option>

                            <option value="Casual">Casual</option>
                            <option value="Formal">Formal</option>
                            <option value="Smart Casual">Smart Casual</option>
                            <option value="Business Casual">Business Casual</option>
                            <option value="Business Formal">Business Formal</option>
                            <option value="Smart Party">Smart Party</option>
                            <option value="Casual Party">Casual Party</option>
                            <option value="Formal Party">Formal Party</option>
                            <option value="Ethnic Party">Ethnic Party</option>
                            <option value="Wedding Ethnic">Wedding Ethnic</option>
                            <option value="Wedding">Wedding</option>

                        </select>

                    </div>

                    <!-- CITY -->

                    <div class="mb-4">

                        <label class="form-label fw-bold">

                            Location

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="city"
                            placeholder="Enter your city"
                            required
                        >

                    </div>

                    <!-- BUTTON -->

                    <div class="text-center">

                        <button
                            type="submit"
                            class="btn btn-dark btn-lg"
                            id="submitBtn"
                        >

                            ✨ Discover Your Perfect Outfit

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<!-- LOADING SCREEN -->

<div
    id="loadingScreen"
    style="
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:white;
        z-index:9999;
    "
>

    <div
        class="d-flex flex-column justify-content-center align-items-center"
        style="height:100vh;"
    >

        <div
            class="spinner-border text-dark"
            style="
                width:4rem;
                height:4rem;
            "
        >
        </div>

        <h3 class="mt-4">

            Finding Your Perfect Outfit...

        </h3>

        <p class="text-muted">

            Analyzing Skin Tone • Checking Weather • Matching Styles

        </p>

    </div>

</div>

<script>

const imageInput =
    document.getElementById("imageInput");

const previewImage =
    document.getElementById("previewImage");

imageInput.addEventListener(
    "change",
    function(e){

        const file =
            e.target.files[0];

        if(!file) return;

        const reader =
            new FileReader();

        reader.onload = function(event){

            previewImage.src =
                event.target.result;

            previewImage.style.display =
                "block";
        };

        reader.readAsDataURL(file);
    }
);

document
.querySelector("form")
.addEventListener(
    "submit",
    function(){

        document
        .getElementById("loadingScreen")
        .style.display =
            "block";
    }
);

</script>

</body>

</html>
